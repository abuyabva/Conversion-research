services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: conversion
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-synthetic-only}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d conversion"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      Data__Provider: Postgres
      ConnectionStrings__Analytics: Host=db;Database=conversion;Username=demo;Password=${POSTGRES_PASSWORD:-local-synthetic-only};Options=-c default_transaction_read_only=on
      Agent__Mode: ${AGENT_MODE:-Demo}
      Llm__BaseUrl: ${LLM_BASE_URL:-https://api.openai.com/v1/}
      Llm__Model: ${LLM_MODEL:-gpt-4.1-mini}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Provider: ${LLM_PROVIDER:-Auto}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
